name: Build TWA APK (tablet / car head-unit sideload)

# One-off / occasional manual build. Produces a signed APK+AAB that wrap the
# live PWA (https://ultranet1.co.il) as an installable Android app for
# sideloading onto a tablet or an Android-based car multimedia unit.
# Because it's a TWA (Trusted Web Activity), the app just displays the live
# site - no rebuild is needed for normal content/feature updates, only if
# app-level things change (name/icon/package id).
on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "Manifest URL"
        required: false
        default: "https://ultranet1.co.il/manifest.webmanifest"
      package_id:
        description: "Android application ID"
        required: false
        default: "il.co.ultranet1.twa"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate signing key passwords
        run: |
          KEYSTORE_PASS=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          KEY_PASS=$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-20)
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Point bubblewrap at the runner's existing JDK/Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"$JAVA_HOME","androidSdkPath":"$ANDROID_HOME"}
          EOF
          # bubblewrap's path validator expects a legacy `tools/` or `bin/`
          # folder directly under the SDK root; the runner image only ships
          # the newer `cmdline-tools/latest/bin` layout.
          if [ ! -e "$ANDROID_HOME/bin" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/bin"
          fi
          ls -la "$ANDROID_HOME"

      - name: Generate TWA project (bubblewrap init)
        env:
          KEYSTORE_PASS: ${{ env.KEYSTORE_PASS }}
          KEY_PASS: ${{ env.KEY_PASS }}
          TWA_MANIFEST_URL: ${{ inputs.manifest_url }}
          TWA_PACKAGE_ID: ${{ inputs.package_id }}
          TWA_PROJECT_DIR: ${{ github.workspace }}/twa-project
        run: node .github/scripts/twa-init-driver.js

      - name: Build signed APK + AAB (bubblewrap build)
        working-directory: twa-project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: npx --yes @bubblewrap/cli build

      - name: Compute signing key SHA-256 fingerprint
        working-directory: twa-project
        run: |
          keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASS" -alias ultranet \
            | tee keystore-info.txt
        env:
          KEYSTORE_PASS: ${{ env.KEYSTORE_PASS }}

      - name: Save passwords alongside the keystore
        working-directory: twa-project
        run: |
          {
            echo "package_id: ${{ inputs.package_id }}"
            echo "key_alias: ultranet"
            echo "keystore_password: $KEYSTORE_PASS"
            echo "key_password: $KEY_PASS"
          } > signing-credentials.txt
        env:
          KEYSTORE_PASS: ${{ env.KEYSTORE_PASS }}
          KEY_PASS: ${{ env.KEY_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: ultranet-twa-signed
          path: |
            twa-project/app-release-signed.apk
            twa-project/app-release-bundle.aab
            twa-project/android.keystore
            twa-project/signing-credentials.txt
            twa-project/keystore-info.txt
          retention-days: 7
